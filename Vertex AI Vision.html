<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 商品辨識專家 - Smart Identifier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .shimmer {
            background: linear-gradient(90deg, #eff6ff 25%, #dbeafe 50%, #eff6ff 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        
        .audience-tag {
            @apply px-3 py-1 rounded-full text-xs font-bold mr-2 mb-2 inline-block;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <div class="max-w-md mx-auto min-h-screen flex flex-col relative pb-10">
        <!-- 頁首區塊 -->
        <header class="p-6">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900 tracking-tight">AI 商品辨識</h1>
                    <p class="text-sm text-slate-500">專業試用者分析工具</p>
                </div>
                <button onclick="toggleSettings()" class="p-2 bg-white rounded-full shadow-sm active:bg-slate-50">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- API 金鑰設定彈窗 -->
        <div id="settingsPanel" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-6 backdrop-blur-sm">
            <div class="bg-white rounded-3xl w-full p-6 shadow-2xl">
                <h2 class="text-xl font-bold mb-4">API 金鑰管理</h2>
                <p class="text-sm text-slate-500 mb-4">金鑰將僅儲存於您目前的瀏覽器 (LocalStorage)，安全且私密。</p>
                <input type="password" id="apiKeyInput" placeholder="請輸入 Gemini API Key" 
                       class="w-full bg-slate-100 border-none rounded-2xl px-4 py-4 mb-4 focus:ring-2 focus:ring-blue-500 outline-none text-lg">
                <div class="flex gap-3">
                    <button onclick="saveApiKey()" class="flex-1 bg-blue-600 text-white py-3 rounded-2xl font-bold hover:bg-blue-700 active:scale-95 transition">儲存金鑰</button>
                    <button onclick="toggleSettings()" class="flex-1 bg-slate-200 text-slate-600 py-3 rounded-2xl font-bold">取消</button>
                </div>
            </div>
        </div>

        <!-- 主要操作區 -->
        <main class="flex-1 px-6 space-y-6">
            <!-- 上傳區域 -->
            <div id="dropZone" class="relative overflow-hidden bg-white rounded-3xl shadow-sm border-2 border-dashed border-slate-200 p-10 flex flex-col items-center justify-center text-center transition hover:border-blue-400 active:scale-[0.98]"
                 onclick="document.getElementById('fileInput').click()">
                <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812-1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </div>
                <p class="font-medium text-slate-700">拍攝或上傳商品照片</p>
                <p class="text-xs text-slate-400 mt-1">強制使用 Flash Latest 模組</p>
                <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="processImage(event)">
            </div>

            <!-- 狀態與進度顯示 -->
            <div id="statusArea" class="hidden space-y-4">
                <div class="relative rounded-3xl overflow-hidden shadow-md bg-white">
                    <img id="imagePreview" class="w-full h-48 object-cover" />
                    <div id="analyzingOverlay" class="absolute inset-0 bg-black/40 flex items-center justify-center">
                        <div class="flex flex-col items-center">
                            <div class="w-12 h-12 border-4 border-white/30 border-t-white rounded-full animate-spin"></div>
                            <span class="text-white text-sm font-medium mt-3" id="statusMessage">AI 正在深度辨識...</span>
                        </div>
                    </div>
                </div>
                
                <div class="px-2">
                    <div class="flex justify-between text-xs font-bold mb-1">
                        <span class="text-blue-600" id="stepText">分析進度</span>
                        <span id="stepPercent">0%</span>
                    </div>
                    <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                        <div id="stepBar" class="bg-blue-600 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <!-- 分析結果呈現區 -->
            <div id="resultCard" class="hidden">
                <div id="reportContainer" class="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
                    <div class="bg-slate-900 p-6 text-white">
                        <div id="resTitle" class="text-xl font-bold">商品名稱載入中...</div>
                        <div id="resStars" class="text-yellow-400 mt-1 text-sm tracking-widest">⭐⭐⭐⭐⭐</div>
                    </div>

                    <div class="p-6 space-y-6 custom-scroll">
                        <!-- 適用族群與理由 -->
                        <section>
                            <div class="flex justify-between items-center mb-2">
                                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                                    <span class="w-1.5 h-1.5 bg-blue-500 rounded-full"></span> 適用對象
                                </h3>
                            </div>
                            <div id="resTarget" class="flex flex-wrap"></div>
                            <div id="resAudienceReason" class="mt-2 text-xs text-slate-500 bg-slate-50 p-3 rounded-xl border border-slate-100 italic"></div>
                        </section>

                        <section>
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 flex items-center gap-2">
                                <span class="w-1.5 h-1.5 bg-blue-500 rounded-full"></span> 翻譯與說明
                            </h3>
                            <div id="resTranslate" class="text-slate-700 leading-relaxed text-sm whitespace-pre-wrap"></div>
                        </section>

                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                                <h4 class="text-xs font-bold text-emerald-700 mb-2">優點</h4>
                                <ul id="resPros" class="text-xs text-emerald-800 space-y-1 list-disc pl-3"></ul>
                            </div>
                            <div class="bg-rose-50 p-4 rounded-2xl border border-rose-100">
                                <h4 class="text-xs font-bold text-rose-700 mb-2">缺點</h4>
                                <ul id="resCons" class="text-xs text-rose-800 space-y-1 list-disc pl-3"></ul>
                            </div>
                        </div>

                        <section>
                            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 flex items-center gap-2">
                                <span class="w-1.5 h-1.5 bg-blue-500 rounded-full"></span> 市場價格與心得
                            </h3>
                            <div id="resMarket" class="text-slate-700 text-sm bg-slate-50 p-4 rounded-2xl border border-slate-100 whitespace-pre-wrap"></div>
                        </section>

                        <section class="pt-4 border-t border-slate-100 text-center">
                            <div class="text-xs text-slate-400 mb-1 tracking-tighter">專家購買建議</div>
                            <div id="resVerdict" class="font-bold text-blue-600"></div>
                        </section>
                    </div>
                </div>

                <!-- 操作按鈕 -->
                <div class="mt-6 flex gap-3">
                    <button onclick="saveAsImage()" class="flex-1 bg-slate-900 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-2 active:scale-95 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        保存分析圖
                    </button>
                    <button onclick="location.reload()" class="p-4 bg-slate-200 text-slate-600 rounded-2xl active:scale-95 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 px-6 py-3 bg-slate-800 text-white text-sm rounded-full shadow-lg opacity-0 transition-opacity pointer-events-none z-[100]"></div>

    <script>
        const MODEL_NAME = "gemini-flash-latest";
        let base64Image = "";

        document.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('app_gemini_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            } else {
                toggleSettings();
            }
        });

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('hidden');
        }

        function saveApiKey() {
            const val = document.getElementById('apiKeyInput').value.trim();
            if (val) {
                localStorage.setItem('app_gemini_key', val);
                showToast("金鑰已儲存於本地端");
                toggleSettings();
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.replace('opacity-0', 'opacity-100');
            setTimeout(() => t.classList.replace('opacity-100', 'opacity-0'), 2500);
        }

        function updateProgress(percent, msg) {
            document.getElementById('stepBar').style.width = percent + '%';
            document.getElementById('stepPercent').innerText = percent + '%';
            document.getElementById('statusMessage').innerText = msg;
        }

        async function processImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const apiKey = localStorage.getItem('app_gemini_key');
            if (!apiKey) {
                showToast("請先設定 API 金鑰");
                toggleSettings();
                return;
            }

            document.getElementById('dropZone').classList.add('hidden');
            document.getElementById('statusArea').classList.remove('hidden');
            document.getElementById('resultCard').classList.add('hidden');
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                const dataUrl = e.target.result;
                document.getElementById('imagePreview').src = dataUrl;
                base64Image = dataUrl.split(',')[1];
                
                await callAIIdentification(apiKey);
            };
            reader.readAsDataURL(file);
        }

        async function callAIIdentification(apiKey) {
            updateProgress(15, "正在連結 gemini-flash-latest...");
            
            const prompt = `你是一位專業商品分析專家。請分析圖片內容，判斷該商品適合哪些族群使用，並詳細說明理由。
            請回傳 JSON 格式：
            {
                "title": "繁體中文商品名稱",
                "stars": "1-5 數字",
                "audience": ["兒童", "成人", "男生", "女生"], 
                "audience_reason": "詳細說明為何適合這些族群，或為何不適合其他族群(例如：含咖啡因不適合兒童、零件細小、功能專業度等)",
                "translation": "詳細翻譯圖片文字並說明功能",
                "pros": ["優點1", "優點2"],
                "cons": ["缺點1", "缺點2"],
                "market_info": "市場價格範圍與網路心得摘要",
                "verdict": "一句話購買建議"
            }
            請在 audience 陣列中只包含最適合的關鍵字。請勿包含任何 markdown 標記。`;

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`;
                
                updateProgress(45, "AI 正在掃描細節並判斷安全性...");

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                { inlineData: { mimeType: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(`API 錯誤: ${data.error.message}`);
                }

                updateProgress(85, "正在整理族群判定理由...");

                const textResponse = data.candidates[0].content.parts[0].text;
                const jsonStr = textResponse.replace(/```json/g, '').replace(/```/g, '').trim();
                const result = JSON.parse(jsonStr);

                renderResults(result);

            } catch (err) {
                console.error(err);
                alert(`辨識失敗: ${err.message}`);
                location.reload();
            }
        }

        function renderResults(data) {
            document.getElementById('resTitle').innerText = data.title;
            document.getElementById('resStars').innerText = "⭐".repeat(parseInt(data.stars) || 5);
            document.getElementById('resTranslate').innerText = data.translation;
            
            // 渲染族群標籤
            const targetContainer = document.getElementById('resTarget');
            targetContainer.innerHTML = "";
            if (data.audience && Array.isArray(data.audience)) {
                data.audience.forEach(tag => {
                    const span = document.createElement('span');
                    span.className = "audience-tag " + getTagColor(tag);
                    span.innerText = tag;
                    targetContainer.appendChild(span);
                });
            }

            // 顯示族群判定理由
            document.getElementById('resAudienceReason').innerText = "💡 判定理由：" + (data.audience_reason || "根據產品性質分析。");

            document.getElementById('resPros').innerHTML = data.pros.map(p => `<li>${p}</li>`).join('');
            document.getElementById('resCons').innerHTML = data.cons.map(c => `<li>${c}</li>`).join('');
            document.getElementById('resMarket').innerText = data.market_info;
            document.getElementById('resVerdict').innerText = data.verdict;

            setTimeout(() => {
                document.getElementById('statusArea').classList.add('hidden');
                document.getElementById('resultCard').classList.remove('hidden');
            }, 800);
        }

        function getTagColor(tag) {
            if (tag.includes('兒童')) return 'bg-orange-100 text-orange-700';
            if (tag.includes('女生')) return 'bg-pink-100 text-pink-700';
            if (tag.includes('男生')) return 'bg-blue-100 text-blue-700';
            if (tag.includes('成人')) return 'bg-indigo-100 text-indigo-700';
            return 'bg-slate-100 text-slate-700';
        }

        function saveAsImage() {
            const target = document.getElementById('reportContainer');
            showToast("正在生成報告圖片...");
            html2canvas(target, { backgroundColor: "#f1f5f9", scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Analysis_Report_${Date.now()}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
                showToast("圖片已成功下載");
            });
        }
    </script>
</body>
</html>
